<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAVE 低遅延 / 連続比較</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./style.css"></head>
<body><main><header class="masthead"><div class="brand">RAVE <span>BENCH</span><small>REAL MODEL / LIVE AUDIOWORKLET</small></div><a href="./">演奏画面へ ↗</a></header>
<section class="intro"><h1>同じ入力で、経路とモデルを比べる。</h1><p>実モデルをAudioWorkletで連続推論。再生音量は0。ファイル配信以外の通信はありません。</p></section>
<div class="source-row"><label>比較モデル<select id="model" aria-label="比較モデル"></select></label><label>各経路の測定時間<select id="duration" aria-label="各経路の測定時間"><option value="30">30秒</option><option value="60">60秒</option><option value="10">10秒 / 動作確認</option></select></label><label>測定経路<select id="mode" aria-label="測定経路"><option value="both">既存→新経路</option><option value="new">新経路のみ</option><option value="old">既存経路のみ</option></select></label><label>推論環境<select id="backend" aria-label="比較推論環境"><option value="wasm">WASM / 1 thread</option><option value="wasm-2">WASM / 2 threads</option><option value="wasm-4">WASM / 4 threads（新経路のみ）</option><option value="webgpu-retain">WebGPU / GPU状態保持（実験）</option><option value="webgpu">WebGPU / コピー（比較）</option></select></label><label>出力期限<select id="target" aria-label="比較出力期限"><option value="auto">自動</option><option value="24">24 ms</option><option value="32">32 ms</option><option value="40">40 ms</option><option value="48">48 ms</option><option value="29.333333333333332">29.3 ms</option></select></label><label>Worker起床<select id="wake" aria-label="Worker起床方式"><option value="auto">自動</option><option value="blocking">直接待機 / Atomics.wait</option><option value="async">非同期 / waitAsync</option></select></label><button id="run" class="primary">連続比較を開始</button></div>
<p id="status" role="status">一覧を取得中…</p><p class="caption">モデルロード・無音ウォームアップは計測前。初期2秒後の音切れも分けて集計。モデルの時間ずれ・物理入出力遅延は経路遅延に含みません。各経路は順番に実行します。音声サンプルをサーバーに送りません。</p>
<button id="cancel" class="secondary" disabled>停止</button><button id="save" class="secondary" disabled>結果JSON ↓</button><pre id="report" class="benchmark-report">未実行</pre><details><summary>全時系列JSON</summary><pre id="full-report" class="benchmark-report">未実行</pre></details><details><summary>現在の生データ</summary><pre id="current-metrics" class="benchmark-report">未開始</pre></details><div id="message" role="alert" hidden></div>
</main><script type="module" src="./benchmark.mjs"></script></body></html>
